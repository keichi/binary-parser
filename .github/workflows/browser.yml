name: test-browser

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser
      env:
        CI: true
